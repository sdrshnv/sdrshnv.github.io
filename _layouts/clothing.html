<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title }} · {{ site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/clothing.css' | relative_url }}">
  </head>
  <body>
    <header class="masthead">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <a href="{{ '/clothing/' | relative_url }}">Clothing</a>
    </header>

    <main>
      {{ content }}
    </main>
  </body>
</html>
